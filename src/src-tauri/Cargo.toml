[package]
name = "scan-detection"
version = "0.1.0"
description = "ScanDetection Tauri shell"
edition = "2021"

[[bin]]
name = "ScanDetection"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
# 强杀/崩溃兜底：把随软件拉起的 llama 进程树绑入 Job Object（KILL_ON_JOB_CLOSE），
# 壳进程无论以何种方式退出，OS 关闭 Job 句柄即回收整棵进程树（与后端 llm_server.py 同语义）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

# 注：构建 Tauri 需要 Rust 工具链（cargo）。前端可独立用 `pnpm dev` 开发；
# 桌面壳以 `pnpm tauri dev` / `pnpm tauri build` 构建打包。
