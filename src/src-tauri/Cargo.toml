[package]
name = "scan-detection"
version = "0.1.0"
description = "ScanDetection Tauri shell"
edition = "2021"

[[bin]]
name = "ScanDetection"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 注：构建 Tauri 需要 Rust 工具链（cargo）。M1 阶段可仅用 `pnpm dev`
# 开发前端；Tauri 打包与 Python sidecar 注入在 M6 里程碑处理（见 README）。
