[package]
name = "scan-detection"
version = "0.1.0"
description = "ScanDetection Tauri shell"
edition = "2021"

[[bin]]
name = "ScanDetection"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"

# 注：构建 Tauri 需要 Rust 工具链（cargo）。前端可独立用 `pnpm dev` 开发；
# 桌面壳以 `pnpm tauri dev` / `pnpm tauri build` 构建打包。
