name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check backend
      - name: Ruff format check
        run: ruff format --check backend
      - name: Import-linter (layering contract)
        run: lint-imports
      - name: Pyright (type check)
        run: pyright backend
      - name: Pytest (unit + contract + API + eval gate) with coverage
        run: pytest backend/tests
      - name: Evaluation regression gate (Golden Set)
        run: python -m backend.evaluation --golden data/eval/golden --baseline data/eval/baseline.json --work-dir data/eval/.gate_work

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # 与本地开发一致（pnpm 10+ 才支持 pnpm-workspace.yaml 中的
          # onlyBuiltDependencies 构建脚本白名单配置段）
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      - run: cd src && pnpm install --frozen-lockfile
      - run: cd src && pnpm typecheck
      - run: cd src && pnpm lint
      # 单测门禁：router/stores/composables 的 vitest spec
      - run: cd src && pnpm test:run
      - run: cd src && pnpm build

  # 真实检测器冒烟（必过）：仅装 onnxruntime（轻量，避开 torch/ultralytics），
  # 运行接口契约/导入冒烟（无需权重），恢复对 YoloDetector 代码路径的真实门禁覆盖。
  ml-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (dev + onnxruntime)
        run: pip install -e ".[dev]" onnxruntime
      - name: Pytest (detector interface smoke, no weights required)
        run: pytest backend/tests -m ml_smoke -o addopts="" -q

  # 真实推理（需权重，非阻塞）：加载 best.onnx 跑端到端 infer；
  # 模型权重为大文件、通常不随仓库，缺失时本作业优雅 skip，不影响合并。
  ml-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (dev + onnxruntime)
        run: pip install -e ".[dev]" onnxruntime
      - name: Pytest (real detector tier, requires weights)
        run: pytest backend/tests -m ml -o addopts="" -q

  # 依赖锁文件一致性（F29）：requirements.lock 为哈希锁定的可复现依赖快照；
  # 本作业校验其未与 requirements.txt 漂移，并确认可经 --require-hashes 安装。
  # 非阻塞：依赖网络解析，失败不阻断合并，但会提示维护者重新生成锁文件。
  lockfile:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv
      - name: Verify requirements.lock is in sync
        run: |
          uv pip compile requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --generate-hashes \
            --output-file /tmp/requirements.generated.lock
          diff -u requirements.lock /tmp/requirements.generated.lock && echo "lockfile OK"
