name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check backend
      - name: Ruff format check
        run: ruff format --check backend
      - name: Import-linter (layering contract)
        run: lint-imports
      - name: Pytest (unit + contract + API + eval gate) with coverage
        run: pytest backend/tests
      - name: Evaluation regression gate (Golden Set)
        run: python -m backend.evaluation --golden data/eval/golden --baseline data/eval/baseline.json --work-dir data/eval/.gate_work

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: src/yarn.lock
      - run: npm install -g yarn@1.22.22
      - run: cd src && yarn install --frozen-lockfile
      - run: cd src && yarn typecheck
      - run: cd src && yarn build
