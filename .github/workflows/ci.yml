name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check backend
      - name: Ruff format check
        run: ruff format --check backend
      - name: Pyright type check
        run: pyright
      - name: Import-linter (layers)
        run: lint-imports
      - name: Pytest (unit + contract + API)
        run: pytest backend/tests
      # M4 后接入：eval-harness 回归门禁（§15.6，Golden Set 禁训练）

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      - run: cd src && pnpm install --frozen-lockfile
      - run: cd src && pnpm run typecheck
      - run: cd src && pnpm run build
