[project]
name = "scan-detection"
version = "0.1.0"
description = "射线焊缝缺陷智能检测系统（后端）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "pydicom>=2.4",
    "alembic>=1.13",  # 启动期迁移（infra.migrate），运行时依赖
    "numpy>=1.26",
    "scikit-image>=0.22",
    # §7.5 静态加密（AES-256-GCM，security.encrypt 默认开启）属运行时依赖，
    # 此前误置于 dev 致生产安装缺包、服务启动即 ImportError。移到核心依赖。
    "cryptography>=42",
    # 以下均为"缺包即启动失败/功能坏死"的运行时依赖（2026-09 核对 requirements.txt
    # 补齐——此前 pip install -e . 装出的环境 crypto 导入即炸、检测/上传/报告不可用）：
    "gmssl>=3.2.2",  # infra.crypto 顶层导入（SM2/SM3），缺失 = 启动即 ImportError
    "pycryptodomex>=3.23",  # gmssl sm2 的 ASN.1 签名模式依赖
    "opencv-python-headless>=4.9",  # 预处理/量化/标注图顶层链路
    "onnxruntime>=1.17",  # 默认推理后端（detect.kind=trained_yolo + backend=onnx）
    "python-multipart>=0.0.9",  # FastAPI multipart 上传（detect/batch 等）
    "reportlab>=4.0",  # Registry 装配即导入 PdfReporter；规格书首选 weasyprint 因
    #   Windows 缺 GTK/Pango 实测不可用（2026-08-04 M6），v1 用 reportlab（全离线中文字体）
    "pypdf>=4.0",  # M7 PDF/A-1b 后处理（XMP + sRGB OutputIntent + 文档 ID）
    "pillow-heif>=1.0",  # HEIC 解码（image_loader 懒加载，缺失则该格式降级不可用）
]

[project.optional-dependencies]
ml = [
    # 训练/蒸馏工作站用（torch 体积大且推理部署不需要；detector 对 torch 懒加载）
    "torch>=2.2",
    "ultralytics>=8.2",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.4",
    "pyright>=1.1.370",
    "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# planB_run 以 `python -m backend.training.planB_run` 调用，混合大小写模块名不可改
# （改名会破坏已文档化的启动命令与跨项目引用）。
per-file-ignores = { "backend/training/planB_run.py" = ["N999"] }

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--cov=backend --cov-report=term-missing --cov-fail-under=70"
markers = [
    "ml: 需要 ML 推理依赖与权重的真实检测器（YoloDetector）测试；CI 默认 skip，本机装 ML 依赖后运行",
    "ml_smoke: 仅需 onnxruntime（无需权重）的真实检测器接口/导入冒烟；CI ml-smoke 作业必过",
]

[tool.coverage.run]
# 排除训练/打包/标注器等非核心运行路径与生成文件
omit = [
    "backend/training/*",
    "backend/annotator/*",
    "backend/evaluation/*",
    "*/__init__.py",
    "*/test_*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.pyright]
pythonVersion = "3.13"
include = ["backend"]
# 指向项目 venv：让 pyright 解析 fastapi/pydantic/sqlalchemy 等第三方包，
# 避免"类型门禁全红"却全是 reportMissingImports 的工具误报（上线前检查报告遗留项）。
# CI 无此 venv 时 pyright 自动回退到当前解释器（pip install -e .[dev] 已装齐依赖）。
venvPath = "backend"
venv = ".venv"
# 与 [tool.coverage.run].omit 对齐：训练/标注/打包/评估属非运行时工具脚本，
# 不进类型门禁（其依赖 torch/ultralytics 等可选 ml 依赖，本地 venv 不装，
# 强行纳入只会产生 reportMissingImports 噪音）。运行时代码 app/domain/infra + tests 仍全查。
exclude = [
    "backend/.venv",
    "backend/training",
    "backend/models",
    "backend/annotator",
    "backend/evaluation",
]

[tool.importlinter]
root_package = "backend"

[[tool.importlinter.contracts]]
name = "Layering contract (app -> infra -> domain)"
type = "layers"
layers = ["app", "infra", "domain"]
containers = ["backend"]

[[tool.importlinter.contracts]]
name = "Infra must not import business decision logic"
type = "forbidden"
source_modules = ["backend.infra"]
forbidden_modules = ["backend.domain.grade", "backend.domain.preprocess"]
