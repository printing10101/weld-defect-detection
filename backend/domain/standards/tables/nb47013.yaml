# NB/T47013.2-2015 数值表（占位，未授权）
# ⚠️ 本表数值为**公开解读/示例占位**（{{STD_TABLE_*}}），正式使用前必须：
#   1) 以授权标准原文复核所有数值；2) 将 authorized 置为 true。
#   未授权时 Nb47013Grader 熔断（抛 GradingAmbiguousError，不输出级别）。
standard_id: NB/T47013.2-2015
version: "2015"
authorized: false

# 圆形缺陷评定区（按母材厚度 T 分档，宽度 mm）{{STD_TABLE_评定区}}
round_rating_zone_mm:
  - {max_t: 25, width: 10}
  - {max_t: 100, width: 20}
  - {max_t: 999999, width: 30}

# 圆形缺陷点数换算（长径 -> 点数）{{STD_TABLE_点数}}
round_points:
  - {max_d_mm: 1.0, points: 1}
  - {max_d_mm: 2.0, points: 2}
  - {max_d_mm: 3.0, points: 3}
  - {max_d_mm: 4.0, points: 6}
  - {max_d_mm: 5.0, points: 8}
  - {max_d_mm: 6.0, points: 12}
  - {max_d_mm: 7.0, points: 16}
  - {max_d_mm: 8.0, points: 20}
  - {max_d_mm: 9.0, points: 24}
  - {max_d_mm: 10.0, points: 28}
  - {max_d_mm: 12.0, points: 32}

# 不计点数缺陷的最大长径（按 T 分档）{{STD_TABLE_不计}}
round_ignore_size_mm:
  - {max_t: 25, max_d: 0.5}
  - {max_t: 50, max_d: 0.7}
  - {max_t: 100, max_d: 1.0}
  - {max_t: 999999, max_d: 1.5}

# 评定区内允许点数上限（按 T 分档，公开示例待复核）{{STD_TABLE_圆形上限}}
round_grade_limits:
  - {max_t: 10, I: 3, II: 6, III: 12}
  - {max_t: 999999, I: 6, II: 12, III: 18}

# 条形缺陷单个长度限值（T 系数 + 最小/最大 mm）{{STD_TABLE_条形}}
linear_limits:
  level2: {t_factor: 0.333, min_mm: 4, max_mm: 20}
  level3: {t_factor: 0.667, min_mm: 6, max_mm: 30}
