server:
  host: 127.0.0.1
  port: 18773
  cors_origins:                       # CORS 允许源（Tauri webview + 本地开发源；禁 *）
    - http://127.0.0.1:5173
    - http://localhost:5173
    - tauri://localhost
    - https://tauri.localhost
    - http://tauri.localhost
model:
  default_uri: models/weights/best.onnx
  backend: onnx
  weights_dir: models/weights   # 模型注册表扫描目录（§7.4，M4）
  registry_state_file: data/model_registry.json  # 活跃模型指针持久化
  # S-04 推理后端可插拔：ONNX Runtime 执行提供者（默认 CPU 不变）。
  # CUDA（需 onnxruntime-gpu）: ["CUDAExecutionProvider", "CPUExecutionProvider"]
  # 昇腾 CANN（预留写法，需 CANN 版 onnxruntime，未真机验证）:
  #   ["CANNExecutionProvider", "CPUExecutionProvider"]
  # 寒武纪 MLU / DCU（预留写法，需对应厂商 onnxruntime 分发版，未真机验证）:
  #   ["MLUExecutionProvider", "CPUExecutionProvider"] / ["DCUExecutionProvider", ...]
  # 各 provider 依赖的运行时库须随部署包分发，可用性以厂商文档为准（未真机验证）。
  providers: [CPUExecutionProvider]
  # S-17 运行期模型回退：连续推理异常达到阈值 → 自动回退上一稳定版本 + 告警/审计
  infer_failure_threshold: 3
  auto_rollback: true
security:
  encrypt: true
auth:  # 三员身份认证（C-06/C-07/C-09）
  challenge_ttl_sec: 60   # 登录挑战有效期（一次一用，防重放）
  idle_timeout_min: 15    # 会话空闲超时（分钟，滑动过期）
  session_ttl_min: 720    # 会话绝对有效期（分钟）
  max_sessions: 1         # 单账号并发会话上限（超限吊销最旧会话）
  max_failed_attempts: 5  # 连续挑战失败锁定阈值
  lockout_min: 30         # 锁定时长（分钟），触发时落安全告警
alerts:  # 安全告警规则（C-22 异常行为告警，各 kind 开关/阈值集中配置）
  batch_export:           # 批量导出：窗口期内同一操作者导出下载≥threshold 次 → high 告警
    enabled: true
    window_min: 10        # 计数窗口（分钟）
    threshold: 5          # 触发阈值（仅在跨越阈值那一刻告警一次，防刷屏）
  unauthorized_access:    # 越权访问（require_role 403）→ warn 告警
    enabled: true
  account_lockout:        # 登录失败锁定 → critical 告警
    enabled: true
export:  # 导出管控（C-14）
  require_approval: true  # 报告 PDF/清单导出需保密员预授权（一次性导出令牌）
  token_ttl_sec: 600      # 一次性导出令牌有效期（秒）
eval:
  golden_dir: data/eval/golden          # 固定版本化评估集（禁止用于训练）；缺失则 evaluate 返回 409
  drift_baseline_path: data/eval/drift_baseline.json  # 漂移监控参考基线
  experiments_dir: data/experiments      # 实验追踪 JSONL 落盘（§7.4）
  auto_on_activate: true                 # 模型激活后自动跑 Golden Set 评估
sync:
  kind: local                            # local | http | cloud(v3 联邦占位，未实现)
  http_endpoint: null                    # kind=http 时的推送 URL
  http_token: null                       # 可选 Bearer Token（建议环境变量注入，勿入库）
  http_timeout: 10.0                     # HTTP 同步推送超时（秒）
egress:  # 进程级外联防护（C-16）
  enabled: true            # 启动时装配外联拦截（socket/urllib 层）
  allow_cidrs: []          # 额外放行的目的网段（CIDR）；回环 127.0.0.0/8、::1/128 代码恒放行。
                           # 默认空 = 除回环外全拦截（纯离线从严默认）；
                           # 启用 http 同步时须显式加入端点网段，如 192.168.1.0/24
ipc:  # IPC 一次性启动令牌（C-17）
  enforce: true            # 业务请求须带 X-IPC-Token（或 Bearer 会话）；
                           # 令牌随启动生成写入 data/ipc_token，Tauri 注入 WebView。
                           # 单机调试可 SCAN_IPC__ENFORCE=false（生产保持 true）
annotator:
  enabled: false                         # 随主应用同进程启动标注器（默认关）
  host: 127.0.0.1
  port: 8899
paths:
  data_dir: data
  tmp_dir: data/tmp
  db_path: data/scan.db
  # S-03 数据库方言：非空时优先于 db_path 作为完整 SQLAlchemy URL
  # （达梦/人大金仓示例见 backend/infra/db.py docstring；未真机验证）。
  db_url: ""
  images_dir: data/images
  reports_dir: data/reports
density:
  low: 2.0
  high: 4.5
  # 翻拍影像（相机拍灯箱）黑度绝对值不可测（8bit 上限 2.41）：
  # warn=黑度/IQI/质量门禁降级为告警+强制人工复核；block=与扫描件同等严格
  photo_policy: warn
film_region:
  enabled: true                # 评片前先分割胶片有效区（翻拍影像可评的前置）
  min_area_frac: 0.08          # 胶片区最小占画面比例（低于视为分割失败）
  max_photo_area_frac: 0.88    # 胶片占比低于此值才可能判翻拍（满幅=扫描件）
  surround_bright_gray: 200.0  # 环绕背景"亮"的灰度下限（灯箱过曝特征）
  surround_min_frac: 0.05      # 亮背景占整幅最小占比（低阈偏安全：误判翻拍仅多人工复核）
iqi:
  type: wire  # wire | hole（线型/孔型像质计，§4.2）
  # 线型像质计丝号直径（公开参考，正式使用前须按 IQI 标准复核）
  wire_diameters_mm: [3.2, 2.5, 2.0, 1.6, 1.25, 1.0, 0.8, 0.63, 0.5, 0.4, 0.32, 0.25, 0.2, 0.16, 0.125, 0.1, 0.08, 0.063, 0.05]
  required_wire_no: 10
  # 孔型像质计孔径（公开参考，正式使用前须按 IQI 标准复核）
  hole_diameters_mm: [1.0, 0.8, 0.63, 0.5, 0.4, 0.32, 0.25, 0.2, 0.16, 0.125]
  required_hole_no: 6
  min_contrast_ratio: 3.0
  auto_locate: true            # 自动定位像质计（模板匹配），关闭则须前端/人工给 ROI
  locate_threshold: 0.3         # 像质计带垂直周期性强度下限（低于视为未找到）
  # A/AB/B 影像质量等级 → 线型像质计要求丝号（公开参考，正式使用前须按标准复核）
  # 每项：[透照厚度上限 mm, A级要求丝号, AB级要求丝号, B级要求丝号]；等级越严要求越细
  sensitivity:
    - [2.0, 14, 13, 12]
    - [4.0, 13, 12, 11]
    - [8.0, 12, 11, 10]
    - [12.0, 11, 10, 9]
    - [18.0, 10, 9, 8]
    - [30.0, 9, 8, 7]
    - [50.0, 8, 7, 6]
    - [80.0, 7, 6, 5]
    - [120.0, 6, 5, 4]
    - [200.0, 5, 4, 3]
    - [350.0, 4, 3, 2]
    - [9999.0, 3, 2, 1]
pseudo_defect:
  hough_threshold: 60
  scratch_min_ratio: 0.5
  scratch_grating_min_lines: 5
  canny_lo: 40
  canny_hi: 120
  uniformity_low_freq: 0.012
  uniformity_max_ratio: 6.0
  dust_tophat_k: 15
  dust_min_area: 10
  dust_max_count: 400
  block_on_scratch: true    # 长直划痕阻断评片
  block_on_uniformity: false  # 显影不均默认仅告警（焊件自然灰度梯度大）
  block_on_dust: false      # 尘点密集默认仅告警
preprocess:
  bilateral_d: 9
  bilateral_sigma_color: 75.0
  bilateral_sigma_space: 75.0
  median_k: 3
  clahe_clip: 2.0
  clahe_grid: 8
  canny_kernel: 5
  morph_k_open: 3
  morph_k_close: 3
  gamma: 1.0  # 请求未传 gamma 时的缺省值（1.0 = 跳过伽马校正）
  enabled: true  # run_inspection 中是否应用降噪+增强（关闭则对原始 gray 推理）
quality:
  w_noise: 0.25
  w_sharp: 0.20
  w_contrast: 0.20
  w_dynamic: 0.15
  w_uniform: 0.10
  w_artifact: 0.10
  min_score: 70.0           # RQI 门限（0–100），低于判不合格（已按真实底片标定）
  block_on_quality: true    # True=不合格阻断评片；False=仅告警+need_review
  noise_good: 4.0           # 噪声σ ≤ 此值满分
  noise_bad: 14.0           # 噪声σ ≥ 此值 0 分
  sharp_good: 1.5           # 平均梯度幅值满分阈值（真实底片实测 ~0.7–8.7，原 18 严重偏高）
  contrast_good: 25.0       # 信号对比度（中值滤波后 std）满分阈值
  dr_good: 0.6              # 动态范围利用率（(p99−p1)/255）满分阈值
  uniformity_low_freq: 0.012
  uniformity_max_ratio: 6.0
  dust_tophat_k: 15
  dust_min_area: 10
  dust_max_count: 400
  # 三类硬门禁（反证测试后补强；任一触发即判不合格，不扰动已标定 RQI）
  blur_lap_bad: 30.0         # Laplacian 方差低于此值判失焦/模糊（真实底片实测 ≥45）
  exposure_entropy_bad: 0.62 # 直方图熵(归一化)低于此值判过/欠曝（真实底片实测 ≥0.73）
  stain_smooth_bad: 0.15     # 平滑异常斑块占比高于此值判污渍（真实底片实测 ≤0.14）
detect:
  kind: trained_yolo  # 检测器种类（注册表键）：trained_yolo=YOLO 训练模型，baseline_blob=连通域基线
  quantifier_kind: mask  # 量化器种类（注册表键）：mask=掩膜精修(M4b)，bbox=包围盒近似(M4a)
  baseline_enabled: false  # M4b 训练模型检测器已接入；权重缺失时自动回退 M4a 基线
  allow_baseline_fallback: true  # false = 训练模型加载失败即启动失败（生产建议 false）
  infer_conf: 0.3   # 推理置信度阈值（§T8：统一入口，禁散落硬编码）
  infer_iou: 0.5    # NMS IoU 阈值
  # 逐类置信度阈值（ADR-010）：稀有/安全关键缺陷低阈值优先召回，气孔高阈值抑误检。
  # 键=DefectClass.value(0气孔/1夹渣/2未焊透/3未熔合/4裂纹/5咬边/6内凹)，
  # 未列出的类回落 infer_conf。注意：必须与 DetectCfg 默认值保持同步
  # （此前缺 6: 0.10 致内凹实际回落 0.30，召回被静默收紧 3 倍）。
  class_conf: {0: 0.30, 1: 0.12, 2: 0.12, 3: 0.08, 4: 0.05, 5: 0.18, 6: 0.10}
  round_aspect_max: 3.0  # 圆形/条形分界（NB/T47013：L/W<=3 记为圆形缺陷）
  min_area_px: 30
  max_area_px: 200000
  min_size_px: 3
  noise_sigma_ratio: 2.5
  abs_threshold: 8.0
  dark_only: false
  review_conf: 0.5  # 检测不确定性阈值，超过则 need_review（人工兜底，M4b/ADR-010）
  # Tiling 分块推理：大幅底片整图 letterbox 到 640 时小缺陷（细裂纹/小气孔）
  # 被缩到不可见，是召回率天花板；分块后单瓦片缩放比 ≈2 倍，特征保留。
  # 代价：推理次数 ≈ 瓦片数（8K 底片约 64 次 CPU 前向，单图秒级→十秒级），
  # 批量吞吐下降；调 batch.workers 或换 GPU provider 可摊平。tile_size 置 0 关闭。
  tile_size: 1280
  tile_overlap: 0.2       # 重叠区同一缺陷被相邻瓦片各检一次，由跨瓦片 NMS 合并
  tile_trigger_side: 2400 # 最长边超过此值才分块；小图（含 Golden 合成 512px）整图推理不受影响
  tile_max_count: 400     # 超大底片超此瓦片数时按 1.5× 放大瓦片（平滑降级，不失控耗时）
  tile_merge_iou: 0.3     # 跨瓦片合并 NMS 的 IoU（比推理 NMS 宽松：相邻瓦片回归框
                          # 不完全重合，取 0.3 防同缺陷合并失败成双检；按类独立合并）
mask_refine:
  enabled: true               # False=退化为包围盒近似（与 BBoxQuantifier 等价）
  blur_k: 5                   # ROI 高斯平滑核（奇数）
  adaptive_block: 31         # 自适应阈值窗口（奇数，≤ROI 短边）
  adaptive_c: 8.0             # 自适应阈值常数 C（0–255 量纲，越大越保守）
  min_mask_abs_area_px: 4     # 轮廓面积小于此值丢弃
  min_mask_rel_area: 0.25     # 掩膜面积须 ≥ 此比例×框面积，否则回退包围盒（抗误检）
  close_k: 5                  # 形态学闭运算核（填补断裂）
  round_aspect_max: 3.0       # 圆形/条形分界（NB/T47013：L/W<=3 为圆形）
upload:
  max_bytes: 209715200  # 200 MiB 单文件上限（超限返回 413）
  allowed_suffixes: [".png", ".jpg", ".jpeg", ".jfif", ".bmp", ".gif", ".webp",
                     ".tif", ".tiff", ".avif", ".heic", ".heif",
                     ".pgm", ".ppm", ".pnm", ".ico",
                     ".dcm", ".dicom", ".ima"]
standard:
  default_id: NB/T47013.2-2015
  tables_filename: nb47013.yaml
review:
  kappa_threshold: 0.8  # Cohen's κ 高度一致阈值（§15.3）；低于则升级仲裁
gate:  # 底片合格性门禁补充（DB50/T 1807-2025 §5 扫描参数，评片硬前置）
  min_dpi: 600        # 扫描分辨率下限；DICOM 按 PixelSpacing 推算
  require_dpi: false  # dpi 无法确定时：true=从严拦截；false=放行并告警留档
  min_bit_depth: 16   # 位深硬门禁下限（8bit 底片灰度精度不足）
  allow_8bit: false   # true=8bit 降级放行（告警留档）；false=硬拦截
  rejects_dir: data/rejects  # 不合格底片留档目录（密文归档）
observability:
  log_format: text             # text=人类可读（本地默认）；json=结构化单行日志（可观测接入）
  enable_metrics: true         # 进程内指标采集（/api/v1/metrics 导出）
batch:
  workers: 2            # 批量并行 worker 数（§12.1）
  max_per_batch: 100    # 单批最大图数（防一次性打爆资源）
  per_image_estimate_sec: 8.0  # 单图预估耗时（进度/预计时间展示用）
  max_retained_batches: 50     # 内存保留终结批次上限（防长跑内存随批次无界增长）
  max_retained_snapshot_files: 200  # 磁盘快照保留上限（data/batch/*.json 超限后剪枝最旧"已完成且无重试价值"快照，防磁盘无界增长）
backup:  # S-12 备份增强（GB/T 25000.51 可靠性：数据可恢复）
  interval_hours: 24.0  # 自动备份间隔（小时）；0=关闭定期调度。首轮等满一个间隔才执行，冷启动零负担
  include_images: false # 备份是否纳入影像目录（true 时逐文件 SM3 校验，归档变大；SM4 加密后体积见 crypto 性能说明）
watchdog:  # S-09 内存监控与自愈（生产开启：告警阈值偏低 + 超阈触发壳侧重启）
  enabled: true           # 后台线程周期采样 RSS，超阈值告警
  interval_sec: 30.0      # 采样周期（秒）
  rss_warn_mb: 2048.0     # RSS 告警阈值（MB）→ security alert + 审计
  rss_restart_mb: 4096.0  # RSS 重启标记阈值（MB）；graceful_restart=true 时写标记文件
  graceful_restart: true  # true=写 data/restart_required，由 Tauri 壳检测并优雅重启后端
disk_space:  # S-20 磁盘水位告警（生产开启：防磁盘写满导致 DB/WAL/报告故障）
  enabled: true           # 后台线程周期统计 data 分区剩余空间，低水位告警
  interval_sec: 300.0     # 采样周期（秒），低频避免无谓 I/O
  warn_ratio_pct: 10.0    # 剩余空间比例阈值（%），低于即告警
  warn_min_bytes: 1073741824  # 剩余空间绝对阈值（字节，1 GiB），任一触发即告警
modelgate:  # E-14 更新即重评投产门禁（默认 false=旧行为：activate 即切换）
  enabled: false        # true=activate 先跑 Golden 评估，达标进 candidate，需 sysadmin 审批投产
  min_map: 0.0          # Golden mAP@0.5 下限（0=宽松，仅要求评估可完成）
  min_recall: 0.0       # Golden 召回下限（0=宽松）
std_eval:  # DB50/T 1807-2025 标准评价（§9~§11）
  iou_standard: 0.1     # 标准口径（§9.2：IOU≥0.1 即位置匹配）
  iou_strict: 0.3       # 严格口径（比标准严：双阈值并行，分级取较差者）
  weld_form: single     # single=单面焊（重点关注含内凹/咬边，默认取严）
  weld_method: manual   # manual/auto（FRR 分级线不同：10%/8%）
  strict_frr: true      # FRR 判定线取收紧值（自动3%/手工4%，即标准 L2 线）
  frr_l1_auto: 0.08
  frr_l1_manual: 0.10
  frr_strict_auto: 0.03
  frr_strict_manual: 0.04
  aspect_round_max: 3.0  # 夹渣形状分流：L/W<=3 归圆形缺陷
  eval_dir: data/eval
  personnel_path: data/eval/std_personnel.json  # 评价/标注人员资质（TSG Z8001）
